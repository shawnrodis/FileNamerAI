[package]
name = "file-namer-ai"
version = "1.3.5"
edition = "2021"

[dependencies]
eframe = "0.27"
egui = "0.27"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pdf-extract = "0.7"
exif = { package = "kamadak-exif", version = "0.5" }

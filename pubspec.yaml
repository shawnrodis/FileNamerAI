name: filenamer_ai_flutter
description: "File Namer AI — Rust core + Flutter UI. Rename photos/videos by date and documents via local Ollama."
publish_to: 'none'
version: 1.4.2+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  desktop_drop: ^0.6.1
  file_picker: ^8.1.4
  ffi: ^2.1.0
  http: ^1.2.2
  path: ^1.9.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

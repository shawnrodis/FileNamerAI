# File Namer AI — macOS DMG builder (mirrors SmartLifeTuyaDesktop's).
#
# STAGED FILE: this workflow is not in .github/workflows/ yet because
# pushing workflow files needs the `workflow` token scope. To activate
# it, copy this file to .github/workflows/release-mac.yml in the repo
# via the GitHub web UI — unchanged (see MAC_BUILD.md).
#
# Trigger: every published GitHub release (plus manual dispatch
# against an existing tag). It builds the app for both Apple
# architectures on a real Mac runner, lipos them into ONE universal
# binary, assembles FileNamerAI.app with the repo's icon, ad-hoc
# codesigns it (the build is deliberately unsigned), wraps it in
# FileNamerAI-v<version>.dmg and uploads the DMG to the same release
# the Windows installer lives on — one version, both platforms.

name: macOS DMG

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (e.g. v1.3.16)"
        required: true
        type: string

permissions:
  contents: write # gh release upload

env:
  CARGO_TERM_COLOR: always

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - name: Resolve the release tag
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "Building macOS DMG for release $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.rel.outputs.tag }}

      - name: Install the Apple Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build — Apple Silicon
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build — Intel
        run: cargo build --release --target x86_64-apple-darwin

      - name: Lipo into one universal binary
        run: |
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/file-namer-ai \
            target/x86_64-apple-darwin/release/file-namer-ai \
            -output dist/FileNamerAI
          # Prove both slices are really in there.
          lipo -info dist/FileNamerAI

      - name: Assemble FileNamerAI.app
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          APP="dist/FileNamerAI.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp dist/FileNamerAI "$APP/Contents/MacOS/FileNamerAI"
          chmod +x "$APP/Contents/MacOS/FileNamerAI"

          # AppIcon.icns from the repo's assets/icon.png.
          ICONSET="dist/AppIcon.iconset"
          mkdir -p "$ICONSET"
          sips -z 16 16     assets/icon.png --out "$ICONSET/icon_16x16.png"      >/dev/null
          sips -z 32 32     assets/icon.png --out "$ICONSET/icon_16x16@2x.png"   >/dev/null
          sips -z 32 32     assets/icon.png --out "$ICONSET/icon_32x32.png"      >/dev/null
          sips -z 64 64     assets/icon.png --out "$ICONSET/icon_32x32@2x.png"   >/dev/null
          sips -z 128 128   assets/icon.png --out "$ICONSET/icon_128x128.png"    >/dev/null
          sips -z 256 256   assets/icon.png --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256   assets/icon.png --out "$ICONSET/icon_256x256.png"    >/dev/null
          sips -z 512 512   assets/icon.png --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512   assets/icon.png --out "$ICONSET/icon_512x512.png"    >/dev/null
          sips -z 1024 1024 assets/icon.png --out "$ICONSET/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>FileNamerAI</string>
            <key>CFBundleDisplayName</key>
            <string>File Namer AI</string>
            <key>CFBundleIdentifier</key>
            <string>com.shawnrodis.filenamerai</string>
            <key>CFBundleExecutable</key>
            <string>FileNamerAI</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
          find "$APP" -type f | sort

      - name: Ad-hoc codesign (deliberately unsigned)
        run: |
          codesign --force --deep --sign - dist/FileNamerAI.app
          codesign --verify --verbose=2 dist/FileNamerAI.app

      - name: Build the DMG
        id: dmg
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          DMG="FileNamerAI-v${VERSION}.dmg"
          rm -rf dmgroot
          mkdir dmgroot
          cp -R dist/FileNamerAI.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "File Namer AI" \
            -srcfolder dmgroot -ov -format UDZO "$DMG"
          ls -la "$DMG"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Upload the DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.rel.outputs.tag }}" "${{ steps.dmg.outputs.dmg }}" --clobber
